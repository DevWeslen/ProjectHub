<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Projeto | ProjectHub - Weslen Rian</title>
  
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            primaryDark: '#1e40af',
            secondary: '#0f172a',
            background: '#f8fafc'
          }
        }
      }
    }
  </script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/projetos.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-300">

  <!-- NAVBAR -->
  <header class="bg-slate-950 text-white shadow-md border-b border-slate-800">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 font-bold text-lg hover:text-blue-400 transition">
        <span>← Voltar ao ProjectHub</span>
      </a>
      <div class="flex items-center gap-3">
        <button id="lang-toggle-btn" onclick="toggleLanguage(); location.reload();" 
                class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
          🇺🇸 EN
        </button>
        <button id="theme-toggle-btn" onclick="toggleTheme()" 
                class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
          Dark
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full" id="project-container">
    <!-- Renderizado via JS -->
  </main>

  <!-- FOOTER -->
  <footer class="bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500 dark:text-slate-400">
    <div class="max-w-5xl mx-auto px-6">
      © ProjectHub • Weslen Rian Pedro da Silva
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id');
      const container = document.getElementById('project-container');
      const lang = localStorage.getItem('lang') || 'pt';

      const projeto = projetos.find(p => p.id === projectId);

      if (!projeto) {
        container.innerHTML = `
          <div class="text-center py-20 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
            <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-4">Projeto não encontrado</h1>
            <p class="text-slate-600 dark:text-slate-300 mb-6">O projeto solicitado não foi localizado na base de dados.</p>
            <a href="index.html" class="inline-block bg-primary text-white px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-primaryDark transition">
              Voltar para a página inicial
            </a>
          </div>
        `;
        return;
      }

      const nome = (lang === 'en' && projeto.nomeEn) ? projeto.nomeEn : projeto.nome;
      const descComp = (lang === 'en' && projeto.descricaoCompletaEn) ? projeto.descricaoCompletaEn : (projeto.descricaoCompleta || projeto.descricao);
      const atuacao = (lang === 'en' && projeto.atuacaoEn) ? projeto.atuacaoEn : projeto.atuacao;

      document.title = `${nome} | ProjectHub`;

      const githubHtml = projeto.github ? `
        <div class="mt-8">
          <a href="${projeto.github}" target="_blank" rel="noopener noreferrer" 
             class="inline-flex items-center gap-2 bg-slate-900 dark:bg-slate-800 hover:bg-black text-white text-sm font-semibold px-5 py-3 rounded-xl transition shadow-md">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            ${lang === 'en' ? 'View Code on GitHub' : 'Ver Código no GitHub'}
          </a>
        </div>
      ` : '';

      container.innerHTML = `
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-md border border-slate-200 dark:border-slate-700 p-8 md:p-10">
          <div class="mb-8">
            <span class="inline-block px-3 py-1 bg-blue-100 dark:bg-blue-950 text-blue-800 dark:text-blue-300 text-xs font-bold rounded-full mb-3 uppercase tracking-wider">
              ${projeto.categoria.toUpperCase()}
            </span>
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 dark:text-white leading-tight mb-4">${nome}</h1>
          </div>

          <div class="overflow-hidden rounded-xl mb-8 border border-slate-200 dark:border-slate-700 max-h-96">
            <img src="${projeto.imagem}" alt="${nome}" class="w-full h-full object-cover ${projeto.classeFiltro || ''}">
          </div>

          <div class="grid grid-cols-1 gap-8 mb-8">
            <div>
              <h2 class="text-lg font-bold text-primary dark:text-blue-400 mb-3">${lang === 'en' ? 'Overview' : 'Visão Geral'}</h2>
              <p class="text-slate-700 dark:text-slate-300 leading-relaxed">${descComp}</p>
            </div>

            <div>
              <h2 class="text-lg font-bold text-primary dark:text-blue-400 mb-3">${lang === 'en' ? 'Role & Impact' : 'Minha Atuação & Impacto'}</h2>
              <p class="text-slate-700 dark:text-slate-300 leading-relaxed">${atuacao}</p>
            </div>
          </div>

          <div class="mb-8">
            <h2 class="text-lg font-bold text-primary dark:text-blue-400 mb-3">${lang === 'en' ? 'Technologies' : 'Tecnologias'}</h2>
            <div class="flex flex-wrap gap-2">
              ${projeto.tecnologias.map(t => `
                <span class="px-3.5 py-1.5 bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-200 text-xs font-medium rounded-lg border border-slate-200 dark:border-slate-600">
                  ${t}
                </span>
              `).join('')}
            </div>
          </div>

          ${githubHtml}
        </div>
      `;
    });
  </script>
</body>
</html>
